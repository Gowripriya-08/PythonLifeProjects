
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            background: rgb(234, 228, 228);
            width: 400px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #555;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            border-color: #903a6c;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .result-box {
            margin-top: 25px;
        }

        .result {
            background: #f3f4ff;
            color: #333;
            font-weight: bold;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1> Priya Calculator</h1>

        <form method="post" onsubmit="return checkNumbers()">

            {% csrf_token %}

            <label for="num1">Number 1</label>
            <input type="number"
                   id="num1"
                   name="a"
                   placeholder="Enter first number">

            <label for="num2">Number 2</label>
            <input type="number"
                   id="num2"
                   name="b"
                   placeholder="Enter second number">

            <label for="opr">Select Operator</label>

            <select name="opr" id="opr">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (*)</option>
                <option value="/">Division (/)</option>
                <option value="**">Exponential (**)</option>
            </select>

            <button type="submit">Calculate</button>

            <div class="result-box">
                <label for="result">Result</label>

                <input type="text"
                       id="result"
                       class="result"
                       value="{{ solution }}"
                       placeholder="Your answer will appear here"
                       readonly>
            </div>

        </form>

    </div>


    <script>

        function checkNumbers() {

            let number1 = document.getElementById("num1").value;
            let number2 = document.getElementById("num2").value;
            let operator = document.getElementById("opr").value;

            if (number1 == "" || number2 == "") {
                alert("Please enter both numbers.");
                return false;
            }

            if (operator == "/" && number2 == 0) {
                alert("You cannot divide by zero.");
                return false;
            }

            return true;
        }

    </script>

</body>

</html>
