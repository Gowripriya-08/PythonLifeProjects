<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>

    <h1>Student List</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Class</th>
            <th>Age</th>
            <th>Parent Contact</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.roll }}</td>
            <td>{{ student.class_name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.parentcontact }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No students added yet.</td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <a href='/modelappl/template/student_update.html'>Add New Student</a>

</body>
</html>
